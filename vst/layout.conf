# MB Dyna MPC skin layout. Tabs: BANDS (threshold, ratio, makeup per band, on and solo), TIME (attack and
# release per band), SETUP (split points, mode, detector, levels, slots).
# Band columns stay left of x ~1000: MPC's Q-Link panel covers the right 255 px while a Q-Link is turned.
# Dark slate panel, white print, teal accent.
style=td3
qlink_bounds=column
theme_bg=101416
theme_panel=101416
theme_line=000000
theme_ink=eef3f4
theme_ink_dim=9aa8ab
theme_ink_faint=4d5a5d
theme_accent=2ec4b6
theme_accent_hi=7fe7dc
theme_knob_face=222a2d
theme_knob_ring=000000
theme_knob_dot=2ec4b6
theme_bar=2ec4b6
theme_seg_active=2ec4b6
theme_seg_inactive=222a2d
theme_seg_active_tx=101416
theme_btn_text=eef3f4
theme_well=000000
theme_knob_off=3a4649
theme_tab_on=2ec4b6
theme_tab_on_tx=101416
theme_lcd=071413
theme_box=0b0f10
theme_btn_bg=222a2d
theme_chrome_ink=eef3f4
theme_go_on=2ec4b6
theme_go_off=7fe7dc
theme_tabs=2ec4b6

[tab BANDS]
frame x=36 y=88 w=232 h=624 title="1  LOW"
knob cx=152 cy=215 r=34 label="THRESHOLD" key=thresh1
knob cx=152 cy=365 r=34 label="RATIO" key=ratio1
knob cx=152 cy=515 r=34 label="MAKEUP" key=makeup1
toggle cx=96 cy=640 label="ON" key=on1 bw=100
toggle cx=208 cy=640 label="SOLO" key=solo1 bw=100
frame x=278 y=88 w=232 h=624 title="2  LOW MID"
knob cx=394 cy=215 r=34 label="THRESHOLD" key=thresh2
knob cx=394 cy=365 r=34 label="RATIO" key=ratio2
knob cx=394 cy=515 r=34 label="MAKEUP" key=makeup2
toggle cx=338 cy=640 label="ON" key=on2 bw=100
toggle cx=450 cy=640 label="SOLO" key=solo2 bw=100
frame x=520 y=88 w=232 h=624 title="3  HIGH MID"
knob cx=636 cy=215 r=34 label="THRESHOLD" key=thresh3
knob cx=636 cy=365 r=34 label="RATIO" key=ratio3
knob cx=636 cy=515 r=34 label="MAKEUP" key=makeup3
toggle cx=580 cy=640 label="ON" key=on3 bw=100
toggle cx=692 cy=640 label="SOLO" key=solo3 bw=100
frame x=762 y=88 w=232 h=624 title="4  HIGH"
knob cx=878 cy=215 r=34 label="THRESHOLD" key=thresh4
knob cx=878 cy=365 r=34 label="RATIO" key=ratio4
knob cx=878 cy=515 r=34 label="MAKEUP" key=makeup4
toggle cx=822 cy=640 label="ON" key=on4 bw=100
toggle cx=934 cy=640 label="SOLO" key=solo4 bw=100
frame x=1004 y=88 w=239 h=624 title="MB DYNA"
qlinks "BANDS" = thresh1,ratio1,makeup1,-,thresh2,ratio2,makeup2,-,thresh3,ratio3,makeup3,-,thresh4,ratio4,makeup4,-

[tab TIME]
frame x=36 y=88 w=232 h=624 title="1  LOW"
knob cx=152 cy=250 r=34 label="ATTACK" key=attack1
knob cx=152 cy=460 r=34 label="RELEASE" key=release1
frame x=278 y=88 w=232 h=624 title="2  LOW MID"
knob cx=394 cy=250 r=34 label="ATTACK" key=attack2
knob cx=394 cy=460 r=34 label="RELEASE" key=release2
frame x=520 y=88 w=232 h=624 title="3  HIGH MID"
knob cx=636 cy=250 r=34 label="ATTACK" key=attack3
knob cx=636 cy=460 r=34 label="RELEASE" key=release3
frame x=762 y=88 w=232 h=624 title="4  HIGH"
knob cx=878 cy=250 r=34 label="ATTACK" key=attack4
knob cx=878 cy=460 r=34 label="RELEASE" key=release4
frame x=1004 y=88 w=239 h=624 title="DETECTOR"
knob cx=1123 cy=175 r=34 label="REACT" key=react
enum_v cx=1123 cy=380 label="DETECTOR" key=scmode sw=180
enum_v cx=1123 cy=590 label="SC BOOST" key=boost sw=180
qlinks "TIME" = attack1,release1,-,-,attack2,release2,-,-,attack3,release3,-,-,attack4,release4,-,-

[tab SETUP]
frame x=36 y=88 w=474 h=300 title="SPLIT"
knob cx=115 cy=250 r=34 label="SPLIT 1" key=split1
knob cx=273 cy=250 r=34 label="SPLIT 2" key=split2
knob cx=431 cy=250 r=34 label="SPLIT 3" key=split3
frame x=520 y=88 w=474 h=300 title="LEVEL"
knob cx=599 cy=250 r=34 label="INPUT" key=input
knob cx=757 cy=250 r=34 label="OUTPUT" key=output
knob cx=915 cy=250 r=34 label="MIX" key=mix
frame x=36 y=398 w=474 h=314 title="MODE"
enum_h cx=273 cy=560 label="CROSSOVER" key=mode sw=150
frame x=520 y=398 w=474 h=314 title="SLOTS"
knob cx=620 cy=555 r=34 label="SLOT" key=slot
button cx=780 cy=555 w=120 h=60 label="LOAD" key=load
button cx=915 cy=555 w=120 h=60 label="SAVE" key=save
qlinks "SETUP" = split1,split2,split3,-,input,output,mix,-,slot
